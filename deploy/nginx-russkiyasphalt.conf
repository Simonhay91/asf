# /etc/nginx/sites-available/russkiyasphalt
# После правки: sudo nginx -t && sudo systemctl reload nginx
#
# SSL: если certbot уже настроен, пути к сертификатам ниже должны совпадать.
# Иначе: sudo certbot --nginx -d russkiyasphalt.ru -d www.russkiyasphalt.ru

# www → apex (HTTP)
server {
    listen 80;
    listen [::]:80;
    server_name www.russkiyasphalt.ru;
    return 301 https://russkiyasphalt.ru$request_uri;
}

# apex HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name russkiyasphalt.ru;
    return 301 https://russkiyasphalt.ru$request_uri;
}

# www → apex (HTTPS)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.russkiyasphalt.ru;

    ssl_certificate /etc/letsencrypt/live/russkiyasphalt.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/russkiyasphalt.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://russkiyasphalt.ru$request_uri;
}

# Main site
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name russkiyasphalt.ru;

    ssl_certificate /etc/letsencrypt/live/russkiyasphalt.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/russkiyasphalt.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/russkiyasphalt/frontend/dist;
    index index.html;

    # Trailing slash (skip paths with a file extension)
    rewrite ^([^.]*[^/])$ $1/ permanent;

    location = /robots.txt {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /webhook/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Per-path index.html (prerender) → backend meta injection fallback
    location / {
        try_files $uri $uri/ @spa;
    }

    location @spa {
        proxy_pass http://127.0.0.1:8000/__spa?path=$uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
