# /etc/nginx/sites-available/russkiyasphalt
# После правки: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name russkiyasphalt.ru www.russkiyasphalt.ru;

    root /var/www/russkiyasphalt/frontend/dist;
    index index.html;

    # API + SEO files → backend
    location = /robots.txt {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }
    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /webhook/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    # Static assets (Vite hashed files)
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA: static files → per-path index.html → backend meta injection
    location / {
        try_files $uri $uri/ @spa;
    }

    location @spa {
        proxy_pass http://127.0.0.1:8000/__spa?path=$uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
