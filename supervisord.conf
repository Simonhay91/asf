[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:backend]
command=/bin/bash -c "source /app/venv/bin/activate && uvicorn backend.main:app --host 0.0.0.0 --port 8001"
directory=/app
autostart=true
autorestart=true
stderr_logfile=/var/log/backend.err.log
stdout_logfile=/var/log/backend.out.log
environment=PYTHONPATH="/app"

[program:frontend]
command=/bin/bash -c "cd /app/frontend && npm run dev -- --host 0.0.0.0"
directory=/app/frontend
autostart=true
autorestart=true
stderr_logfile=/var/log/frontend.err.log
stdout_logfile=/var/log/frontend.out.log
